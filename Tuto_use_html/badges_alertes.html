
<!-- Badges -->

<!-- Pill (défaut) -->
<span class="badge badge--pill badge--success">Succès</span>
<span class="badge badge--pill badge--danger">Erreur</span>

<!-- Square -->
<span class="badge badge--square badge--warning">Attention</span>

<!-- Outline -->
<span class="badge badge--pill badge--outline-primary">Info</span>



<!-- Alertes -->

<div class="alert alert--info">
  <i class="alert__icon ti ti-info-circle" aria-hidden="true"></i>
  <div class="alert__body">
    <p class="alert__title">Information</p>
    <p class="alert__text">Une mise à jour est disponible.</p>
  </div>
  <button class="alert__close" aria-label="Fermer">✕</button>
</div>

<div class="alert alert--success">
  <i class="alert__icon ti ti-circle-check" aria-hidden="true"></i>
  <div class="alert__body">
    <p class="alert__title">Succès</p>
    <p class="alert__text">Vos modifications ont été enregistrées.</p>
  </div>
  <button class="alert__close" aria-label="Fermer">✕</button>
</div>
