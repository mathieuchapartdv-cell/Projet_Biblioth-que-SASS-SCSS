

<!-- Cover simple texte + bouton, centré, plein écran -->

<section class="cover cover--full cover--center">
  <div class="cover__content">
    <h1 class="cover__title">Bienvenue sur mon site</h1>
    <p class="cover__subtitle">Une bibliothèque CSS faite maison.</p>
    <div class="cover__actions">
      <a href="#" class="btn btn--solid-primary btn--md">Découvrir</a>
      <a href="#" class="btn btn--outline-primary btn--md">En savoir plus</a>
    </div>
  </div>
</section>


<!-- Cover avec image de fond + voile -->

<section class="cover cover--full cover--image cover--overlay cover--center">
  <img class="cover__bg-image" src="photo.jpg" alt="">
  <div class="cover__content">
    <h1 class="cover__title">Mon titre</h1>
    <p class="cover__subtitle">Mon sous-titre</p>
    <div class="cover__actions">
      <a href="#" class="btn btn--solid-primary btn--md">Commencer</a>
    </div>
  </div>
</section>


<!-- Cover avec vidéo de fond -->

<section class="cover cover--full cover--video cover--overlay cover--left">
  <video class="cover__bg-video" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
  <div class="cover__content">
    <h1 class="cover__title">Mon titre</h1>
    <div class="cover__actions">
      <a href="#" class="btn btn--solid-primary btn--md">Commencer</a>
    </div>
  </div>
</section>
