<!-- Carte basique statique -->

<div class="card">
    <div class="card__image">
        <img src="photo.jpg" alt="Description">
    </div>
    <div class="card__body">
        <h3 class="card__title">Titre de la carte</h3>
        <p class="card__subtitle">Sous-titre</p>
        <p class="card__text">Description de la carte avec du texte.</p>
        <div class="card__actions">
            <a href="#" class="btn btn--solid-primary btn--sm">Voir plus</a>
        </div>
    </div>
</div>


<!-- Carte avec hover -->

<div class="card card--hoverable">
    <div class="card__image">
        <img src="photo.jpg" alt="Description">
    </div>
    <div class="card__body">
        <h3 class="card__title">Titre de la carte</h3>
        <p class="card__subtitle">Sous-titre</p>
        <p class="card__text">Description de la carte avec du texte.</p>
        <div class="card__actions">
            <a href="#" class="btn btn--solid-primary btn--sm">Voir plus</a>
        </div>
    </div>
</div>


<!-- Carte statistique -->

<div class="card card--stat card--hoverable">
  <span class="card__stat-value">98%</span>
  <span class="card__stat-label">Satisfaction client</span>
</div>


<!-- Carte horizontale -->

<div class="card card--horizontal">
  <div class="card__image">
    <img src="photo.jpg" alt="">
  </div>
  <div class="card__body">
    <h3 class="card__title">Article récent</h3>
    <p class="card__text">Résumé de l'article...</p>
    <div class="card__actions">
      <a href="#" class="btn btn--ghost-primary btn--sm">Lire</a>
    </div>
  </div>
</div>
