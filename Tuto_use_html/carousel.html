<!-- JS en bas de page -->
<script src="js/carousel.js"></script>

<!-- Carousel classique -->

<div class="carousel">
  <div class="carousel__track">
    <div class="carousel__slide">
      <h2 class="carousel__slide-title">Slide 1</h2>
      <p class="carousel__slide-text">Description de la slide</p>
    </div>
    <div class="carousel__slide">
      <h2 class="carousel__slide-title">Slide 2</h2>
      <p class="carousel__slide-text">Description de la slide</p>
    </div>
    <div class="carousel__slide">
      <h2 class="carousel__slide-title">Slide 3</h2>
      <p class="carousel__slide-text">Description de la slide</p>
    </div>
  </div>

  <button class="carousel__arrow carousel__arrow--prev" aria-label="Précédent">‹</button>
  <button class="carousel__arrow carousel__arrow--next" aria-label="Suivant">›</button>

  <span class="carousel__counter"></span>
  <div class="carousel__progress"></div>

  <div class="carousel__dots">
    <button class="carousel__dot" aria-label="Slide 1"></button>
    <button class="carousel__dot" aria-label="Slide 2"></button>
    <button class="carousel__dot" aria-label="Slide 3"></button>
  </div>
</div>


<!-- Carousel Médiéval -->

<div class="carousel carousel--medieval">
  <span class="carousel__ornament carousel__ornament--tl">⚜</span>
  <span class="carousel__ornament carousel__ornament--tr">⚜</span>
  <span class="carousel__ornament carousel__ornament--bl">⚜</span>
  <span class="carousel__ornament carousel__ornament--br">⚜</span>

  <div class="carousel__track">
    <div class="carousel__slide">
      <h2 class="carousel__slide-title">⚔ Chronique I</h2>
      <p class="carousel__slide-text">Le royaume se prépare à la guerre</p>
    </div>
    <div class="carousel__slide">
      <h2 class="carousel__slide-title">⚔ Chronique II</h2>
      <p class="carousel__slide-text">L'alliance des royaumes du nord</p>
    </div>
  </div>

  <button class="carousel__arrow carousel__arrow--prev" aria-label="Précédent">‹</button>
  <button class="carousel__arrow carousel__arrow--next" aria-label="Suivant">›</button>

  <span class="carousel__counter"></span>
  <div class="carousel__progress"></div>

  <div class="carousel__dots">
    <button class="carousel__dot" aria-label="Slide 1"></button>
    <button class="carousel__dot" aria-label="Slide 2"></button>
  </div>
</div>
